# Castle OS — minimal Samba config for the live USB / installed system.
# One authenticated share; no guest access. After first boot:
#   smbpasswd -a root        # set the SMB password (live user is root)
# Then connect from any machine:  \\castle\vault  (or smb://castle/vault)

[global]
   workgroup = CASTLE
   server string = Castle
   security = user
   map to guest = never
   log file = /var/log/samba/%m.log
   max log size = 50
   # Apple clients play nicer with these two
   vfs objects = fruit streams_xattr
   fruit:metadata = stream

[vault]
   path = /srv/castle
   browseable = yes
   read only = no
   valid users = root
   create mask = 0644
   directory mask = 0755

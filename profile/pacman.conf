#
# Castle OS Phase 1 pacman.conf — archiso build-time package source config.
# Mirrors the standard Arch layout; uncomment/add your preferred mirror in
# /etc/pacman.d/mirrorlist at build time. Never point this at third-party
# mirrors (DOGS default-deny: official Arch repos only).
#

[options]
Architecture = x86_64
CheckSpace
VerbosePkgLists
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

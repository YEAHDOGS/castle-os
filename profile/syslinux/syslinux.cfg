TIMEOUT 30
DEFAULT castle-analyze

PROMPT 0

MENU TITLE Castle OS Phase 1

LABEL castle-analyze
    MENU LABEL ^Analyze (inspect disks, read-only)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% img_loop=%ARCHISO_IMG% earlymodules=loop castle.mode=analyze

LABEL castle-backup
    MENU LABEL ^Backup (copy data to Castle share)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% img_loop=%ARCHISO_IMG% earlymodules=loop castle.mode=backup

LABEL castle-nuke
    MENU LABEL ^Nuke (NOT IMPLEMENTED — refuses to wipe)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% img_loop=%ARCHISO_IMG% earlymodules=loop castle.mode=nuke

LABEL castle-reinstall
    MENU LABEL ^Reinstall (NOT IMPLEMENTED — no writes)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% img_loop=%ARCHISO_IMG% earlymodules=loop castle.mode=reinstall

LABEL castle-gui
    MENU LABEL ^GUI mode (sway on Wayland)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% img_loop=%ARCHISO_IMG% earlymodules=loop castle.mode=analyze
    TEXT HELP
        Boots like Analyze, then run 'sway' for the Wayland GUI.
    ENDTEXT

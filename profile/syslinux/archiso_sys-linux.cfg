LABEL castle-cli
TEXT HELP
Boot Castle OS in headless CLI mode (BIOS).
No GUI packages are installed in this mode; this is the
router / NAS / server personality.
ENDTEXT
MENU LABEL Castle OS (headless CLI, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% castle.mode=cli

LABEL castle-gui
TEXT HELP
Boot Castle OS with the labwc Wayland desktop (BIOS).
ENDTEXT
MENU LABEL Castle OS (GUI Wayland, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% castle.mode=gui
